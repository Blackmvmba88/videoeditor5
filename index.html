<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlackMamba Video Editor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <div class="eyebrow">BLACKMAMBA LABS</div>
          <h1>Video Editor V0</h1>
        </div>
        <label class="open-button">
          Abrir video
          <input id="fileInput" type="file" accept="video/mp4,video/quicktime,video/webm" hidden />
        </label>
      </header>

      <section class="stage">
        <video id="video" controls playsinline></video>
        <div id="emptyState" class="empty-state">Arrastra o abre un video para empezar.</div>
      </section>

      <section class="controls">
        <button id="markIn">I · Marcar IN</button>
        <button id="markOut">O · Marcar OUT</button>
        <button id="clearMarks">Limpiar</button>
        <div class="readout">
          <span>IN <strong id="inValue">—</strong></span>
          <span>OUT <strong id="outValue">—</strong></span>
          <span>DUR <strong id="durationValue">—</strong></span>
        </div>
      </section>

      <section class="timeline-card">
        <div class="timeline-labels">
          <span>Timeline</span>
          <span id="timeValue">00:00.000 / 00:00.000</span>
        </div>
        <div id="timeline" class="timeline">
          <div id="selection" class="selection"></div>
          <div id="playhead" class="playhead"></div>
        </div>
        <input id="scrubber" type="range" min="0" max="1000" value="0" />
      </section>

      <footer class="hint">Space: play/pause · I: IN · O: OUT</footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
