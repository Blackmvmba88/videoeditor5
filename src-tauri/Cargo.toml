[package]
name = "blackmamba-video-editor"
version = "0.1.0"
description = "Minimal non-destructive video cutter"
authors = ["BlackMamba Records"]
edition = "2021"

[lib]
name = "blackmamba_video_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
